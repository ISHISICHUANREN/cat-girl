<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff8ee">
<meta name="description" content="输入名字，测出 1–100 的猫娘指数。同名同分，纯属娱乐 🐾">
<meta property="og:type" content="website">
<meta property="og:title" content="猫娘指数检测器 🐾">
<meta property="og:description" content="输入名字，测出 1–100 的猫娘指数。同名同分，纯属娱乐。">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56S12 44 12 30a11 11 0 0120-6 11 11 0 0120 6c0 14-20 26-20 26z' fill='%23ffb27a' stroke='%234a3730' stroke-width='3'/%3E%3C/svg%3E">
<title>猫娘指数检测器 🐾</title>
<style>
  *{box-sizing:border-box}
  :root{
    --ink:#4a3730;
    --ink-soft:#6b5148;
    --cream:#fff8ee;
    --apricot:#ffb27a;
    --peach:#ffd9c0;
    --mint:#a8dfc9;
    --accent:#ffb27a;
  }
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;padding:44px 18px 56px;
    display:flex;justify-content:center;overflow-x:hidden;
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(700px 480px at 8% -6%, #ffe6cf 0%, rgba(255,230,207,0) 62%),
      radial-gradient(640px 460px at 94% 4%, #d9f3e7 0%, rgba(217,243,231,0) 60%),
      radial-gradient(600px 480px at 50% 112%, #ffe9dd 0%, rgba(255,233,221,0) 62%),
      var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(circle, rgba(74,55,48,.07) 1.2px, transparent 1.6px);
    background-size:26px 26px;
    mask-image:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.08));
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.08));
  }
  .blob{position:fixed;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none;z-index:0}
  .blob.b1{width:300px;height:300px;left:-100px;top:20%;background:#ffd2b0;animation:bob 13s ease-in-out infinite}
  .blob.b2{width:280px;height:280px;right:-90px;bottom:8%;background:#c4ecdb;animation:bob 16s ease-in-out infinite reverse}
  @keyframes bob{50%{transform:translateY(-24px) scale(1.05)}}

  main{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}

  header{text-align:center;margin-bottom:24px}
  .sticker{
    display:inline-block;padding:6px 13px;margin-bottom:14px;
    font-size:10.5px;font-weight:800;letter-spacing:.14em;
    background:#fff;border:2px solid var(--ink);border-radius:999px;
    box-shadow:3px 3px 0 rgba(74,55,48,.14);transform:rotate(-1.2deg);
  }
  h1{
    margin:0;font-size:clamp(30px,7vw,42px);line-height:1.2;font-weight:900;
    color:var(--ink);text-shadow:2px 2px 0 #ffd9c0, 4px 4px 0 rgba(168,223,201,.6);
  }
  h1 .paw{text-shadow:none;font-size:.72em;vertical-align:-.04em;margin-left:.06em;display:inline-block;transform:rotate(-8deg)}
  .sub{margin:12px 0 0;font-size:13.5px;color:#8d7264;font-weight:700}

  form.search{
    width:100%;display:flex;gap:9px;padding:8px;
    background:#fff;border:2.5px solid var(--ink);border-radius:999px;
    box-shadow:5px 6px 0 rgba(74,55,48,.13);
  }
  form.search:focus-within{box-shadow:5px 6px 0 rgba(74,55,48,.13), 0 0 0 5px rgba(255,178,122,.3)}
  .field{position:relative;flex:1;display:flex;align-items:center;min-width:0}
  .field .ico{position:absolute;left:15px;font-size:15px;opacity:.75;pointer-events:none}
  #name{
    width:100%;padding:13px 15px 13px 42px;font-size:16px;font-family:inherit;font-weight:700;
    color:var(--ink);background:#fff;border:0;border-radius:999px;outline:none;
  }
  #name::placeholder{color:#c4aa9b;font-weight:500}
  #name.shake{animation:shake .38s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .go{
    flex:none;padding:0 20px;font:inherit;font-size:14.5px;font-weight:900;letter-spacing:.03em;
    color:var(--ink);background:linear-gradient(135deg,#ffc79a,#ffd9b8);
    border:2px solid var(--ink);border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .go:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .go:disabled{opacity:.6;cursor:progress}
  .hint{margin:13px 0 0;font-size:12px;color:#a68b7c;font-weight:700;min-height:18px;transition:color .2s}
  .hint.error{color:#d9634f}

  /* ---------- result card ---------- */
  .card{
    width:100%;margin-top:28px;padding:26px 24px 24px;
    background:#fff;border:3px solid var(--ink);border-radius:30px;
    box-shadow:7px 9px 0 rgba(74,55,48,.12);
    opacity:0;transform:translateY(16px) scale(.99);
    transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1);
  }
  .card[hidden]{display:none}
  .card.in{opacity:1;transform:none}

  .gauge{position:relative;width:250px;max-width:78%;margin:0 auto -2px;aspect-ratio:1}
  .gauge svg{display:block;width:100%;height:100%;overflow:visible}
  .ear{fill:#ffd9c0;stroke:var(--ink);stroke-width:7;stroke-linejoin:round}
  .ear-in{fill:#ffb9b0;opacity:.75}
  .track{fill:none;stroke:#f5e6d9;stroke-width:16}
  .prog{fill:none;stroke:url(#fish);stroke-width:16;stroke-linecap:round;filter:drop-shadow(0 4px 10px rgba(255,178,122,.45))}
  .gauge-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-top:6%;
  }
  .gauge-label{font-size:10px;font-weight:900;letter-spacing:.28em;color:#b79a88;margin-bottom:6px}
  .num{font-size:62px;font-weight:900;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
  .num-sub{font-size:10.5px;font-weight:800;letter-spacing:.18em;color:#b79a88;margin-top:5px}

  .r-who{text-align:center;font-size:12px;font-weight:700;color:#a68b7c;margin:14px 0 4px}
  .r-who strong{color:#6b5148;font-weight:800}
  .r-who .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:#d8bfae;margin:0 7px;vertical-align:middle}
  h2{margin:6px 0 10px;text-align:center;font-size:26px;line-height:1.3;font-weight:900;color:var(--accent)}
  .verdict{margin:0 0 20px;text-align:center;font-size:13.5px;line-height:1.8;color:var(--ink-soft);font-weight:500}

  .dims{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .dim{
    background:#fffaf3;border:1.5px dashed #e8d2c0;border-radius:14px;padding:10px 12px;
  }
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .dim-label{font-size:11px;font-weight:800;color:#a0867a}
  .dim-val{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
  .dim-track{height:5px;border-radius:999px;background:#f3e4d8;overflow:hidden}
  .dim-fill{height:100%;width:0;border-radius:999px;transition:width .9s cubic-bezier(.16,1,.3,1)}

  .note{
    font-size:12px;line-height:1.7;color:#7d6a5e;font-weight:600;
    background:#f1faf6;border:1.5px solid #cfeade;border-radius:14px;
    padding:10px 13px;margin-bottom:18px;
  }
  .actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .btn{
    font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    padding:10px 15px;border-radius:999px;border:2px solid var(--ink);
    background:#fff;color:var(--ink);box-shadow:3px 3px 0 rgba(74,55,48,.2);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(74,55,48,.2)}
  .btn.share{background:linear-gradient(135deg,#ffc79a,#ffdcc0)}
  .btn.again{background:#eef8f2}

  .history{width:100%;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
  .history[hidden]{display:none}
  .history-label{font-size:10px;letter-spacing:.16em;color:#b79a88;text-transform:uppercase;font-weight:800}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .chip{
    font:inherit;font-size:11.5px;font-weight:700;color:#8d7264;cursor:pointer;
    padding:6px 11px;border-radius:999px;background:#fff;border:1.5px solid #e6d2c2;
    max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:border-color .15s,color .15s;
  }
  .chip:hover{border-color:var(--apricot);color:var(--ink)}
  .chip em{font-style:normal;color:#d9634f;font-weight:900;margin-left:4px}

  footer{margin-top:34px;text-align:center;font-size:11px;line-height:1.9;color:#b1968a;max-width:460px;font-weight:500}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
    max-width:86vw;padding:11px 18px;border-radius:999px;text-align:center;
    font-size:13px;font-weight:700;color:#fff;background:var(--ink);
    box-shadow:4px 4px 0 rgba(74,55,48,.2);
    opacity:0;pointer-events:none;z-index:200;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .paws{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
  .paw-bit{position:absolute;bottom:-40px;opacity:0;animation:floatUp linear forwards;will-change:transform}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) rotate(0)}
    12%{opacity:1}
    100%{opacity:0;transform:translateY(-108vh) rotate(18deg)}
  }

  @media (max-width:520px){
    body{padding:30px 14px 42px}
    .card{padding:22px 18px 20px;border-radius:26px;box-shadow:6px 7px 0 rgba(74,55,48,.12)}
    .gauge{width:226px;max-width:82%}
    .num{font-size:54px}
    h2{font-size:23px}
    form.search{flex-wrap:wrap;border-radius:24px}
    .go{width:100%;padding:12px 18px;border-radius:999px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .blob{display:none}
  }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<main>
  <header>
    <span class="sticker">FOR FUN · 纯属娱乐</span>
    <h1>猫娘指数检测器 <span class="paw">🐾</span></h1>
    <p class="sub">输入名字，测测你的猫系浓度 🐱</p>
  </header>

  <form class="search" id="form" autocomplete="off" novalidate>
    <div class="field">
      <span class="ico" aria-hidden="true">🐾</span>
      <input id="name" name="name" type="text" maxlength="24" placeholder="输入名字 / 昵称…" aria-label="名字" enterkeyhint="go">
    </div>
    <button class="go" id="goBtn" type="submit">测一测</button>
  </form>
  <p class="hint" id="hint">同名同分 · 猫猫认证 ✨</p>

  <section class="card" id="card" hidden aria-live="polite">
    <div class="gauge">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="fish" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ffc79a"/>
            <stop offset="50%"  stop-color="#ffb27a"/>
            <stop offset="78%"  stop-color="#a8dfc9"/>
            <stop offset="100%" stop-color="#8fd3c0"/>
          </linearGradient>
        </defs>
        <path class="ear" d="M78 96 L60 34 Q57 25 66 29 L120 64 Z"/>
        <path class="ear" d="M222 96 L240 34 Q243 25 234 29 L180 64 Z"/>
        <path class="ear-in" d="M84 88 L73 51 L109 70 Z"/>
        <path class="ear-in" d="M216 88 L227 51 L191 70 Z"/>
        <circle class="track" cx="150" cy="160" r="104"/>
        <circle class="prog" id="prog" cx="150" cy="160" r="104" transform="rotate(-90 150 160)"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-label">猫娘指数</div>
        <div class="num" id="num">0</div>
        <div class="num-sub">/ 100</div>
      </div>
    </div>

    <div class="r-who">
      <strong id="whoName"></strong><span class="dot"></span><span id="stamp"></span>
    </div>
    <h2 id="tierName"></h2>
    <p class="verdict" id="verdict"></p>

    <div class="dims" id="dims"></div>
    <div class="note" id="note"></div>

    <div class="actions">
      <button class="btn share" id="shareBtn" type="button">分享给朋友</button>
      <button class="btn" id="copyBtn" type="button">复制报告</button>
      <button class="btn again" id="againBtn" type="button">再测一次</button>
    </div>
  </section>

  <div class="history" id="historyWrap" hidden>
    <span class="history-label">最近</span>
    <div class="chips" id="history"></div>
  </div>

  <footer>
    本检测器纯属娱乐，结果由名字哈希生成，与性别、喜好、养不养猫都无关。<br>
    猫猫不知道你在测什么 🐾
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="paws" id="paws" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };

  var form     = $('#form');
  var input    = $('#name');
  var goBtn    = $('#goBtn');
  var hint     = $('#hint');
  var card     = $('#card');
  var prog     = $('#prog');
  var numEl    = $('#num');
  var tierName = $('#tierName');
  var verdict  = $('#verdict');
  var whoName  = $('#whoName');
  var stamp    = $('#stamp');
  var dimsEl   = $('#dims');
  var noteEl   = $('#note');
  var copyBtn  = $('#copyBtn');
  var shareBtn = $('#shareBtn');
  var againBtn = $('#againBtn');
  var toastEl  = $('#toast');
  var histWrap = $('#historyWrap');
  var histEl   = $('#history');
  var layer    = $('#paws');

  var DEFAULT_HINT = '同名同分 · 猫猫认证 ✨';
  var CIRC = 2 * Math.PI * 104;
  var STORE_KEY = 'catGirl.history.v1';

  /* ---------------- 评级 ---------------- */
  var TIERS = [
    { min: 1,  max: 10,  name: '猫毛过敏', emoji: '🧶', color: '#8fa3b8',
      desc: '看见猫会后退半步，但手机相册里偷偷存了三张猫图。嘴上说不要，身体很诚实。' },
    { min: 11, max: 25,  name: '云吸猫选手', emoji: '🐟', color: '#5fae9c',
      desc: '每天刷猫片两小时，真遇到猫却只会站在原地重复"好可爱"，不敢伸手。' },
    { min: 26, max: 40,  name: '猫咖常客', emoji: '☕', color: '#b58a5f',
      desc: '点一杯最便宜的饮料坐一下午，只为等一只猫路过你的桌子。' },
    { min: 41, max: 55,  name: '猫系少年', emoji: '😺', color: '#e0955f',
      desc: '开始理解猫的逻辑：不想理人不是没礼貌，是在节能。' },
    { min: 56, max: 70,  name: '猫娘预备役', emoji: '🐾', color: '#e8845f',
      desc: '说话会不自觉带上"喵"的尾音，发现的时候已经来不及了。' },
    { min: 71, max: 85,  name: '猫娘本猫', emoji: '🎀', color: '#e86f8f',
      desc: '耳朵一戴，气质自动切换，连走路都变轻了，还会下意识绕开地板缝。' },
    { min: 86, max: 95,  name: '猫界顶流', emoji: '💫', color: '#a27de0',
      desc: '路过猫咖会被猫主动碰瓷，店员都认识你，进门先给你留靠窗的位置。' },
    { min: 96, max: 100, name: '猫神降临', emoji: '👑', color: '#d9a02c',
      desc: '检测仪当场翻肚皮，并发出呼噜声。传说级，建议直接封神。' }
  ];

  var NOTES = [
    '检测仪没有偷吃你的小鱼干。',
    '本结果与猫毛过敏无关，请放心吸。',
    '猫耳只是装饰，请勿伸手去摸。',
    '分数高不代表会喵，低也不代表不能蹭。',
    '数据来源：一只趴在键盘上的猫。',
    '建议截图保存，猫猫看不懂文字。',
    '本报告不提供猫粮推荐（但它可以）。',
    '如果结果偏低，可能只是你藏得比较深。'
  ];

  var DIMS = [
    { key: 'a', label: '撒娇力', color: 'linear-gradient(90deg,#ffd9c0,#ffb27a)' },
    { key: 'b', label: '好奇心', color: 'linear-gradient(90deg,#c4ecdb,#a8dfc9)' },
    { key: 'c', label: '慵懒值', color: 'linear-gradient(90deg,#ffd0d8,#ffb0c0)' },
    { key: 'd', label: '猫缘',   color: 'linear-gradient(90deg,#d9cdf7,#c3b2f0)' }
  ];

  /* ---------------- 哈希 ---------------- */
  function hash32(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    h ^= h >>> 16; h = Math.imul(h, 0x7feb352d);
    h ^= h >>> 15; h = Math.imul(h, 0x846ca68b);
    h ^= h >>> 16;
    return h >>> 0;
  }
  function pick(key, salt) { return hash32(salt + '|' + key); }
  function scoreOf(key) { return 1 + (pick(key, 'cat-score') % 100); }
  function tierOf(score) {
    for (var i = 0; i < TIERS.length; i++) {
      if (score >= TIERS[i].min && score <= TIERS[i].max) return TIERS[i];
    }
    return TIERS[TIERS.length - 1];
  }
  function noteOf(key) { return NOTES[pick(key, 'cat-note') % NOTES.length]; }

  /* ---------------- 动画 ---------------- */
  var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
  var busy = false;
  var REDUCE = false;
  try { REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var state = { name: '', score: 0, tier: null };
  var numGen = 0;
  var hideTimer = 0;
  var toastTimer = 0;

  function countTo(el, target, duration) {
    var gen = ++numGen;
    if (REDUCE) { el.textContent = target; return; }
    var t0 = null;
    function step(t) {
      if (gen !== numGen) return;
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased);
      if (p < 1) raf(step); else el.textContent = target;
    }
    el.textContent = '0';
    raf(step);
  }

  function setRing(score, animate) {
    var offset = CIRC * (1 - score / 100);
    if (REDUCE) {
      prog.style.transition = 'none';
      prog.style.strokeDasharray = CIRC;
      prog.style.strokeDashoffset = offset;
      return;
    }
    prog.style.transition = animate ? 'stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)' : 'none';
    prog.style.strokeDasharray = CIRC;
    if (!animate) {
      prog.style.strokeDashoffset = CIRC;
      void prog.getBoundingClientRect();
      prog.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)';
    }
    raf(function () {
      raf(function () { prog.style.strokeDashoffset = offset; });
    });
  }

  function paws(score) {
    if (REDUCE) return;
    var glyphs = ['🐾', '🐟', '✨', '🐱'];
    var count = 8 + Math.round(score * 0.13);
    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.className = 'paw-bit';
      p.textContent = glyphs[(Math.random() * glyphs.length) | 0];
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.fontSize = (12 + Math.random() * 15) + 'px';
      p.style.animationDuration = (2.5 + Math.random() * 1.6) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      layer.appendChild(p);
      (function (node) { setTimeout(function () { node.remove(); }, 5000); })(p);
    }
  }

  /* ---------------- 历史 ---------------- */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(arr.slice(0, 8))); } catch (e) {}
  }
  function renderHistory() {
    var arr = loadHistory();
    if (!arr.length) { histWrap.hidden = true; return; }
    histWrap.hidden = false;
    histEl.textContent = '';
    arr.forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.title = item.name + ' · ' + item.score + '/100';
      b.textContent = item.name;
      var em = document.createElement('em');
      em.textContent = item.score;
      b.appendChild(em);
      b.addEventListener('click', function () {
        input.value = item.name;
        run(item.name);
      });
      histEl.appendChild(b);
    });
  }
  function pushHistory(name, score) {
    var arr = loadHistory().filter(function (x) { return x.name !== name; });
    arr.unshift({ name: name, score: score });
    saveHistory(arr);
    renderHistory();
  }

  /* ---------------- 提示 ---------------- */
  function flashHint(msg, isError) {
    hint.textContent = msg;
    hint.classList.toggle('error', !!isError);
    clearTimeout(flashHint._t);
    flashHint._t = setTimeout(function () {
      hint.textContent = DEFAULT_HINT;
      hint.classList.remove('error');
    }, 2400);
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2400);
  }

  function copyText(text, okMsg) {
    function ok() { showToast(okMsg || '已复制'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var done = document.execCommand('copy');
        ta.remove();
        if (done) ok(); else showToast('复制失败，请手动选择文字');
      } catch (e) { showToast('复制失败'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  }

  /* ---------------- 渲染 ---------------- */
  function render(name, key, score) {
    var tier = tierOf(score);
    clearTimeout(hideTimer);
    state = { name: name, score: score, tier: tier };

    document.documentElement.style.setProperty('--accent', tier.color);

    whoName.textContent = name;
    var d = new Date();
    stamp.textContent = d.getFullYear() + '.' +
      String(d.getMonth() + 1).padStart(2, '0') + '.' +
      String(d.getDate()).padStart(2, '0');

    tierName.textContent = tier.emoji + ' ' + tier.name;
    verdict.textContent = '「' + name + '」的猫娘指数是 ' + score + '/100。' + tier.desc;
    noteEl.textContent = noteOf(key);

    dimsEl.textContent = '';
    DIMS.forEach(function (dim, i) {
      var val = 1 + (pick(key, 'cat-dim-' + dim.key) % 100);

      var box = document.createElement('div');
      box.className = 'dim';

      var top = document.createElement('div');
      top.className = 'dim-top';
      var lbl = document.createElement('span');
      lbl.className = 'dim-label';
      lbl.textContent = dim.label;
      var v = document.createElement('span');
      v.className = 'dim-val';
      v.textContent = val;
      top.appendChild(lbl); top.appendChild(v);

      var track = document.createElement('div');
      track.className = 'dim-track';
      var fill = document.createElement('div');
      fill.className = 'dim-fill';
      fill.style.background = dim.color;
      track.appendChild(fill);

      box.appendChild(top);
      box.appendChild(track);
      dimsEl.appendChild(box);

      var delay = REDUCE ? 0 : 80 + i * 80;
      setTimeout(function () { fill.style.width = val + '%'; }, delay);
    });

    card.hidden = false;
    void card.offsetWidth;
    card.classList.add('in');
    setRing(score, true);
    countTo(numEl, score, 950);
    paws(score);

    pushHistory(name, score);

    if (window.innerWidth < 760 && card.getBoundingClientRect().top < 0) {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function run(raw) {
    if (busy) return;
    var name = String(raw || '').trim().replace(/\s+/g, ' ');
    if (!name) {
      flashHint('先输入一个名字啦～', true);
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.focus();
      return;
    }
    if (name.length > 24) name = name.slice(0, 24);

    var key = name.toLowerCase();
    var score = scoreOf(key);

    busy = true;
    goBtn.disabled = true;
    var label = goBtn.textContent;
    goBtn.textContent = '检测中…';

    setTimeout(function () {
      render(name, key, score);
      goBtn.textContent = label;
      goBtn.disabled = false;
      busy = false;
    }, 420);
  }

  /* ---------------- 事件 ---------------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    run(input.value);
  });

  goBtn.addEventListener('click', function (e) {
    e.preventDefault();
    run(input.value);
  });

  input.addEventListener('input', function () {
    hint.classList.remove('error');
  });

  copyBtn.addEventListener('click', function () {
    var name = state.tier ? state.name : whoName.textContent;
    var score = state.tier ? state.score : Number(numEl.textContent);
    var hosted = location.protocol === 'http:' || location.protocol === 'https:';
    var link = hosted ? location.origin + location.pathname + '?n=' + encodeURIComponent(name) : '';
    var text = '🐾 猫娘指数检测报告\n姓名：' + name + '\n指数：' + score + ' / 100\n评级：' + tierName.textContent +
      (link ? '\n测测你的：' + link : '') +
      '\n\n—— 纯属娱乐 🐾';
    copyText(text, '报告已复制');
  });

  shareBtn.addEventListener('click', function () {
    if (!state.tier) return;
    var hosted = location.protocol === 'http:' || location.protocol === 'https:';
    var link = hosted ? location.origin + location.pathname + '?n=' + encodeURIComponent(state.name) : '';
    var line = '「' + state.name + '」的猫娘指数是 ' + state.score + '/100 —— ' +
      state.tier.emoji + ' ' + state.tier.name + ' 🐾';
    var payload = line + (link ? '\n测测你的：' + link : '');

    if (hosted && navigator.share) {
      navigator.share({ title: '猫娘指数检测器 🐾', text: line, url: link }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        copyText(payload, '链接已复制，去粘贴给朋友吧');
      });
      return;
    }
    if (link) copyText(payload, '链接已复制，去粘贴给朋友吧');
    else copyText(payload, '已复制文案；把网页放到网上后就能分享链接');
  });

  againBtn.addEventListener('click', function () {
    input.value = '';
    input.focus();
    card.classList.remove('in');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { card.hidden = true; }, 260);
  });

  /* ---------------- 初始化 ---------------- */
  setRing(0, false);
  prog.style.strokeDashoffset = CIRC;
  renderHistory();

  var pre = null;
  try {
    var qs = new URLSearchParams(location.search);
    pre = qs.get('n') || qs.get('name');
  } catch (e) {}
  if (pre) {
    input.value = pre;
    setTimeout(function () { run(pre); }, 260);
  } else if (window.innerWidth >= 760) {
    input.focus();
  }
})();
</script>
</body>
</html>
